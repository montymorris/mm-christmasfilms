<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Christmas films timeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#111214;
    --sprocket:#0a0a0b;
    --paper:#EFE9DC;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--canvas);}
  body{
    font-family:'JetBrains Mono',monospace;
    padding:28px 28px 40px;
  }
  .masthead{
    color:var(--paper);
    text-align:center;
    margin-bottom:18px;
  }
  .masthead .kicker{
    font-size:11px;
    letter-spacing:.35em;
    text-transform:uppercase;
    color:#8a8a84;
    margin:0 0 6px;
  }
  .masthead h1{
    font-family:'Anton',sans-serif;
    font-weight:400;
    font-size:clamp(28px,4vw,44px);
    letter-spacing:.02em;
    margin:0;
    color:var(--paper);
  }
  .masthead h2{
    font-family:Futura,'Futura PT','Century Gothic',sans-serif;
    font-size:20px;
  }
  .filmstrip{
    display:flex;
    justify-content:space-between;
    padding:0 2px;
    margin:14px 0 10px;
  }
  .filmstrip span{
    width:9px;height:9px;border-radius:50%;
    background:var(--canvas);
    border:1.5px solid #4a4a46;
  }
  .reel{
    background:var(--sprocket);
    padding:14px 14px 4px;
    border-radius:4px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
  }
  .cell{
    position:relative;
    aspect-ratio:1/1;
    border-radius:3px;
    overflow:hidden;
    padding:10px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
  }
  .poster-img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:0;
  }
  .cell .num,
  .cell .title,
  .cell .sub{
    position:relative;
    z-index:1;
  }
  .cell.has-photo .num,
  .cell.has-photo .title,
  .cell.has-photo .sub{
    text-shadow:0 1px 3px rgba(0,0,0,.7);
    opacity:0;
    transition:opacity .2s ease;
  }
  .cell.has-photo .poster-img{
    transition:opacity .2s ease;
  }
  .cell.has-photo:hover .title,
  .cell.has-photo:hover .sub{
    opacity:1;
    color:#ffffff;
  }
  .cell.has-photo:hover .poster-img{
    opacity:.55;
  }
  .num{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    font-weight:700;
    letter-spacing:.05em;
    opacity:.85;
  }
  .title{
    font-family:'Anton',sans-serif;
    font-weight:400;
    font-size:14px;
    line-height:1.08;
    letter-spacing:.01em;
  }
  .sub{
    font-family:'JetBrains Mono',monospace;
    font-size:8.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    opacity:.8;
    margin-top:3px;
  }
  .footer{
    text-align:center;
    color:#6f6f6a;
    font-size:10px;
    letter-spacing:.15em;
    text-transform:uppercase;
    margin-top:16px;
  }
  @media (max-width:640px){
    body{padding:16px 12px 28px;}
    .grid{grid-template-columns:repeat(3,1fr);gap:6px;}
    .reel{padding:10px 10px 4px;}
    .cell{padding:7px;}
    .title{font-size:10.5px;}
    .sub{font-size:7.5px;}
    .masthead h1{font-size:22px;}
    .masthead .kicker{font-size:9px;}
    .filmstrip span{width:6px;height:6px;}
  }
</style>
</head>
<body>

<div class="masthead">
  <h1>Christmas films</h1>
</div>

<div class="masthead">
  <h2>A festive selection by Monty Morris</h2>
</div>


<div class="reel">
  <div class="grid" id="grid"></div>
</div>



<script>
const films = [
  {n:1,t:"Nativity",y:"2009",bg:"#8C2F39",fg:"#F6E6D2"},
  {n:2,t:"Elf",y:"2003",bg:"#2F6B3A",fg:"#F4EBD0"},
  {n:3,t:"The Christmas Chronicles",y:"2018",bg:"#A62F28",fg:"#F6E2C8"},
  {n:4,t:"The Christmas Chronicles 2",y:"2020",bg:"#1E3F66",fg:"#E4EFFA"},
  {n:5,t:"The Nightmare Before Christmas",y:"1993",bg:"#2A1B3D",fg:"#E8DCF2"},
  {n:6,t:"The Snowman",y:"1982",bg:"#7EC8E3",fg:"#0E3A4A"},
  {n:7,t:"Home Alone",y:"1990",bg:"#B8452A",fg:"#F6E9D6"},
  {n:8,t:"The Princess Switch",y:"2018",bg:"#7B4FA3",fg:"#EEE3F5"},
  {n:9,t:"Home Alone 2: Lost in New York",y:"1992",bg:"#1B3A4B",fg:"#DCEAF2"},
  {n:10,t:"The Princess Switched Again",y:"2020",bg:"#5C3A82",fg:"#EEE3F5"},
  {n:11,t:"Dr Seuss' The Grinch",y:"2018",bg:"#6B8E4E",fg:"#F1F5E6"},
  {n:12,t:"Nativity 2: Danger in the Manger",y:"2012",bg:"#C9622A",fg:"#F7E4CE"},
  {n:13,t:"Die Hard",y:"1988",bg:"#1F1F22",fg:"#EFE9DC"},
  {n:14,t:"A Boy Called Christmas",y:"2021",bg:"#2E7D7D",fg:"#EAF6F2"},
  {n:15,t:"Die Hard 2",y:"1990",bg:"#3D4A5A",fg:"#E4ECF5"},
  {n:16,t:"Love Actually",y:"2003",bg:"#D6455D",fg:"#FCEBC8"},
  {n:17,t:"Die Hard with a Vengeance",y:"1995",bg:"#5F3E20",fg:"#F3E6D2"},
  {n:18,t:"Nativity 3: Dude, Where's My Donkey",y:"2014",bg:"#B98A4F",fg:"#2A1E0E"},
  {n:19,t:"Live Free or Die Hard",y:"2007",bg:"#12384A",fg:"#D8E7EF"},
  {n:20,t:"The Man Who Invented Christmas",y:"2017",bg:"#6E4A28",fg:"#F3E6D2"},
  {n:21,t:"Spirited",y:"2022",bg:"#F0C419",fg:"#2A2210"},
  {n:22,t:"A Good Day to Die Hard",y:"2013",bg:"#3A3A3E",fg:"#E8E8E4"},
  {n:23,t:"A Christmas Carol (Disney)",y:"2009",bg:"#3A5A78",fg:"#DCE7F0"},
  {n:24,t:"The Polar Express",y:"2004",bg:"#8A1F2B",fg:"#F6E2C8"},
  {n:25,t:"Arthur Christmas",y:"2011",bg:"#F2C744",fg:"#2A2210"}
];

const grid = document.getElementById('grid');
films.forEach(f=>{
  const cell = document.createElement('div');
  cell.className = 'cell';
  cell.style.background = f.bg;
  cell.style.color = f.fg;
  cell.innerHTML = `
    <img class="poster-img" src="poster-${f.n}.jpg" alt="" style="display:none;">
    <div></div>
    <div>
      <div class="title">${f.t}</div>
      <div class="sub">${f.y}</div>
    </div>
  `;
  const img = cell.querySelector('.poster-img');
  img.onload = () => {
    img.style.display = 'block';
    cell.classList.add('has-photo');
  };
  img.onerror = () => {
    img.remove();
  };
  cell.addEventListener('click', () => {
    window.open(
      'https://www.google.com/search?q=' + encodeURIComponent(`${f.t} ${f.y} where to watch`),
      '_blank',
      'noopener'
    );
  });
  grid.appendChild(cell);
});
</script>

</body>
</html>
